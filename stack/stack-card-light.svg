<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg"
     font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="accentL2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="borderL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="50%" stop-color="#54aeff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>
    <filter id="softShadowL2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1b1f2422" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadowL2)">
    <rect x="20" y="14" width="860" height="282" rx="12" fill="#ffffff" stroke="url(#borderL2)"/>
  </g>

  <text x="44" y="48" font-size="18" font-weight="700" fill="#24292f">Tech Stack</text>
  <rect x="44" y="56" height="3" rx="1.5" fill="url(#accentL2)" width="0">
    <animate attributeName="width" begin="0.2s" dur="0.6s" values="0;96" fill="freeze"/>
  </rect>

  <line x1="158" y1="72" x2="158" y2="272" stroke="#d0d7de"/>

  <g opacity="0">
    <animate attributeName="opacity" begin="0.4s" dur="0.5s" values="0;1" fill="freeze"/>
    <text x="44" y="95" font-size="12" letter-spacing="2" fill="#57606a">FRONTEND</text>
    <g font-size="13" fill="#24292f">
      <rect x="170" y="76" width="80" height="28" rx="14" fill="#e8f7fc" stroke="#1b96c2"/>
      <circle cx="185" cy="90" r="4" fill="#1b96c2"/><text x="197" y="95">React</text>
      <rect x="260" y="76" width="120" height="28" rx="14" fill="#fdf8dc" stroke="#b8a400"/>
      <circle cx="275" cy="90" r="4" fill="#b8a400"/><text x="287" y="95">JavaScript</text>
      <rect x="390" y="76" width="72" height="28" rx="14" fill="#ecebff" stroke="#646CFF"/>
      <circle cx="405" cy="90" r="4" fill="#646CFF"/><text x="417" y="95">Vite</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0.7s" dur="0.5s" values="0;1" fill="freeze"/>
    <text x="44" y="147" font-size="12" letter-spacing="2" fill="#57606a">BACKEND</text>
    <g font-size="13" fill="#24292f">
      <rect x="170" y="128" width="72" height="28" rx="14" fill="#fff1e5" stroke="#EC8B2F"/>
      <circle cx="185" cy="142" r="4" fill="#EC8B2F"/><text x="197" y="147">Java</text>
      <rect x="252" y="128" width="128" height="28" rx="14" fill="#e6f6e6" stroke="#6DB33F"/>
      <circle cx="267" cy="142" r="4" fill="#6DB33F"/><text x="279" y="147">Spring Boot</text>
      <rect x="390" y="128" width="64" height="28" rx="14" fill="#f5edff" stroke="#BC85E3"/>
      <circle cx="405" cy="142" r="4" fill="#BC85E3"/><text x="417" y="147">JPA</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="1.0s" dur="0.5s" values="0;1" fill="freeze"/>
    <text x="44" y="199" font-size="12" letter-spacing="2" fill="#57606a">DATABASE</text>
    <g font-size="13" fill="#24292f">
      <rect x="170" y="180" width="80" height="28" rx="14" fill="#e8f1fc" stroke="#4479A1"/>
      <circle cx="185" cy="194" r="4" fill="#4479A1"/><text x="197" y="199">MySQL</text>
      <rect x="260" y="180" width="120" height="28" rx="14" fill="#eaedfc" stroke="#4169E1"/>
      <circle cx="275" cy="194" r="4" fill="#4169E1"/><text x="287" y="199">PostgreSQL</text>
      <rect x="390" y="180" width="104" height="28" rx="14" fill="#e6faf1" stroke="#3FCF8E"/>
      <circle cx="405" cy="194" r="4" fill="#3FCF8E"/><text x="417" y="199">Supabase</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="1.3s" dur="0.5s" values="0;1" fill="freeze"/>
    <text x="44" y="251" font-size="12" letter-spacing="2" fill="#57606a">INFRA·TOOLS</text>
    <g font-size="13" fill="#24292f">
      <rect x="170" y="232" width="88" height="28" rx="14" fill="#e8f2fd" stroke="#2496ED"/>
      <circle cx="185" cy="246" r="4" fill="#2496ED"/><text x="197" y="251">Docker</text>
      <rect x="268" y="232" width="88" height="28" rx="14" fill="#f6f8fa" stroke="#57606a"/>
      <circle cx="283" cy="246" r="4" fill="#24292f"/><text x="295" y="251">Vercel</text>
      <rect x="366" y="232" width="64" height="28" rx="14" fill="#fdeeeb" stroke="#F05032"/>
      <circle cx="381" cy="246" r="4" fill="#F05032"/><text x="393" y="251">Git</text>
      <rect x="440" y="232" width="64" height="28" rx="14" fill="#fdf1e3" stroke="#E37400"/>
      <circle cx="455" cy="246" r="4" fill="#E37400"/><text x="467" y="251">GA4</text>
    </g>
  </g>
</svg>
