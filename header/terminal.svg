<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg"
     font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">
  <defs>
    <!-- 이름에 쓰는 포인트 그라데이션 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <!-- 창 테두리에 은은한 그라데이션 -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- 타이핑 효과: 각 명령 줄을 왼쪽→오른쪽으로 단계적으로 드러냄 -->
    <clipPath id="type1">
      <rect x="42" y="86" width="0" height="26">
        <animate attributeName="width" begin="0.5s" dur="0.8s" fill="freeze"
                 calcMode="discrete" values="0;30;60;90;120;150;180;210;240;270;300"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="42" y="158" width="0" height="26">
        <animate attributeName="width" begin="2.4s" dur="1.0s" fill="freeze"
                 calcMode="discrete" values="0;35;70;105;140;175;210;245;280;315;350"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 터미널 창 -->
  <g filter="url(#softShadow)">
    <rect x="20" y="14" width="860" height="278" rx="12" fill="#0d1117" stroke="url(#border)"/>
  </g>

  <!-- 타이틀바 -->
  <path d="M20 26 q0 -12 12 -12 h836 q12 0 12 12 v22 h-860 z" fill="#161b22"/>
  <line x1="20" y1="48" x2="880" y2="48" stroke="#30363d"/>
  <circle cx="44" cy="31" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="31" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="31" r="6" fill="#27c93f"/>
  <text x="450" y="36" text-anchor="middle" fill="#8b949e" font-size="13">mungwani@github: ~/portfolio</text>

  <!-- ① whoami -->
  <g clip-path="url(#type1)">
    <text x="42" y="105"><tspan fill="#7ee787">➜ ~</tspan><tspan dx="10" fill="#e6edf3">whoami</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" begin="1.5s" dur="0.4s" values="0;1" fill="freeze"/>
    <text x="42" y="138" font-size="24" font-weight="700">
      <tspan fill="url(#accent)">한철완</tspan>
      <tspan dx="12" fill="#e6edf3" font-size="16" font-weight="400">Backend Developer</tspan>
    </text>
  </g>

  <!-- ② cat stack.txt -->
  <g clip-path="url(#type2)">
    <text x="42" y="177"><tspan fill="#7ee787">➜ ~</tspan><tspan dx="10" fill="#e6edf3">cat stack.txt</tspan></text>
  </g>

  <!-- 기술스택 칩 (순서대로 등장) -->
  <g font-size="13" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" begin="3.5s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="42" y="196" width="60" height="26" rx="13" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-opacity="0.5"/>
      <text x="72" y="213" fill="#ffa657">Java</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="3.7s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="112" y="196" width="112" height="26" rx="13" fill="#7ee787" fill-opacity="0.12" stroke="#7ee787" stroke-opacity="0.5"/>
      <text x="168" y="213" fill="#7ee787">Spring Boot</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="3.9s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="234" y="196" width="52" height="26" rx="13" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff" stroke-opacity="0.5"/>
      <text x="260" y="213" fill="#d2a8ff">JPA</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="4.1s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="296" y="196" width="70" height="26" rx="13" fill="#79c0ff" fill-opacity="0.12" stroke="#79c0ff" stroke-opacity="0.5"/>
      <text x="331" y="213" fill="#79c0ff">MySQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="4.3s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="376" y="196" width="74" height="26" rx="13" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.5"/>
      <text x="413" y="213" fill="#58a6ff">Docker</text>
    </g>
  </g>

  <!-- ③ 대기 중인 프롬프트 + 깜빡이는 커서 -->
  <g opacity="0">
    <animate attributeName="opacity" begin="4.8s" dur="0.3s" values="0;1" fill="freeze"/>
    <text x="42" y="262"><tspan fill="#7ee787">➜ ~</tspan></text>
    <rect x="86" y="248" width="9" height="18" fill="#e6edf3">
      <animate attributeName="opacity" begin="4.8s" dur="1.1s" values="1;1;0;0" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
