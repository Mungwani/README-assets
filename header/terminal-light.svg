<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg"
     font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="borderL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="50%" stop-color="#54aeff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>
    <filter id="softShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1b1f2422" flood-opacity="0.18"/>
    </filter>

    <clipPath id="type1L">
      <rect x="42" y="86" width="0" height="26">
        <animate attributeName="width" begin="0.5s" dur="0.8s" fill="freeze"
                 calcMode="discrete" values="0;30;60;90;120;150;180;210;240;270;300"/>
      </rect>
    </clipPath>
    <clipPath id="type2L">
      <rect x="42" y="158" width="0" height="26">
        <animate attributeName="width" begin="2.4s" dur="1.0s" fill="freeze"
                 calcMode="discrete" values="0;35;70;105;140;175;210;245;280;315;350"/>
      </rect>
    </clipPath>
  </defs>

  <g filter="url(#softShadowL)">
    <rect x="20" y="14" width="860" height="278" rx="12" fill="#ffffff" stroke="url(#borderL)"/>
  </g>

  <path d="M20 26 q0 -12 12 -12 h836 q12 0 12 12 v22 h-860 z" fill="#f6f8fa"/>
  <line x1="20" y1="48" x2="880" y2="48" stroke="#d0d7de"/>
  <circle cx="44" cy="31" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="31" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="31" r="6" fill="#27c93f"/>
  <text x="450" y="36" text-anchor="middle" fill="#57606a" font-size="13">mungwani@github: ~/portfolio</text>

  <g clip-path="url(#type1L)">
    <text x="42" y="105"><tspan fill="#1a7f37">➜ ~</tspan><tspan dx="10" fill="#24292f">whoami</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" begin="1.5s" dur="0.4s" values="0;1" fill="freeze"/>
    <text x="42" y="138" font-size="24" font-weight="700">
      <tspan fill="url(#accentL)">한철완</tspan>
      <tspan dx="12" fill="#24292f" font-size="16" font-weight="400">Backend Developer</tspan>
    </text>
  </g>

  <g clip-path="url(#type2L)">
    <text x="42" y="177"><tspan fill="#1a7f37">➜ ~</tspan><tspan dx="10" fill="#24292f">cat stack.txt</tspan></text>
  </g>

  <g font-size="13" text-anchor="middle" font-weight="600">
    <g opacity="0">
      <animate attributeName="opacity" begin="3.5s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="42" y="196" width="60" height="26" rx="13" fill="#fff1e5" stroke="#EC8B2F"/>
      <text x="72" y="213" fill="#b96a12">Java</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="3.7s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="112" y="196" width="112" height="26" rx="13" fill="#e6f6e6" stroke="#6DB33F"/>
      <text x="168" y="213" fill="#3e8e2f">Spring Boot</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="3.9s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="234" y="196" width="52" height="26" rx="13" fill="#f5edff" stroke="#BC85E3"/>
      <text x="260" y="213" fill="#8a4fc4">JPA</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="4.1s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="296" y="196" width="70" height="26" rx="13" fill="#e8f1fc" stroke="#4479A1"/>
      <text x="331" y="213" fill="#2b5f8a">MySQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" begin="4.3s" dur="0.3s" values="0;1" fill="freeze"/>
      <rect x="376" y="196" width="74" height="26" rx="13" fill="#e8f2fd" stroke="#2496ED"/>
      <text x="413" y="213" fill="#186bb0">Docker</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="4.8s" dur="0.3s" values="0;1" fill="freeze"/>
    <text x="42" y="262"><tspan fill="#1a7f37">➜ ~</tspan></text>
    <rect x="86" y="248" width="9" height="18" fill="#24292f">
      <animate attributeName="opacity" begin="4.8s" dur="1.1s" values="1;1;0;0" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
