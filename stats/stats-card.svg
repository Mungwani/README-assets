  <rect x="44" y="56" height="2" rx="1" fill="url(#accent)" width="0">
    <animate attributeName="width" begin="0.2s" dur="0.6s" values="0;96" fill="freeze"/>
  </rect>

  <g transform="translate(44,102)">
  <g transform="translate(0,0)">
