<svg viewBox="0 0 820 205" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="accent-scommit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="border-scommit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <filter id="shadow-scommit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow-scommit)">
    <rect x="10" y="8" width="800" height="189" rx="12" fill="#0d1117" stroke="url(#border-scommit)"/>
  </g>

  <text x="44" y="46" font-size="20" font-weight="700" fill="#e6edf3">SCommit — 개발자 지식 공유 구독 플랫폼</text>
  <text x="776" y="45" text-anchor="end" font-size="12" fill="#8b949e">2026.06 – 2026.07</text>

  <text x="44" y="68" font-size="12" font-weight="600" letter-spacing="1" fill="#79c0ff">백엔드 · 포스트/댓글/검색, 성능 테스트(k6)·모니터링 담당</text>

  <text font-size="13" fill="#c9d1d9"><tspan x="44" y="92">구독 등급별 콘텐츠 접근 제어와 SSE 실시간 알림을 제공하는 지식 공유 플랫폼으로, k6 부하 테스트로 좋아요 API의 DB</tspan><tspan x="44" y="111">락 경합을 규명(p95 529ms→2.5s, 약 5배 저하)하고 개선 방향을 도출함</tspan></text>

  <rect x="44" y="131" height="2" rx="1" fill="url(#accent-scommit)" width="0">
    <animate attributeName="width" begin="0.2s" dur="0.5s" values="0;732" fill="freeze"/>
  </rect>

